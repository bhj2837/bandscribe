# Dataset registry (DATA owner, M1_M2_SPEC §9.5). Source of truth for URLs, sizes, checksums and licenses.
#
# Everything listed here stays on this PC under data/datasets/<name>/ and is never redistributed.
# Per-dataset keys:
#   title, tier ("B" | "C"), access ("zenodo" | "direct" | "gdrive_folder" | "manual"), license, page,
#   approx_bytes (required files; shown before a fetch), loader (module in gtab/datasets/loaders),
#   families (FAMILIES keys that can occur), notes, manual_ko (Korean steps shown when a download must be
#   done by hand). Optional: license_url, doi, zenodo_record, contamination.
# [[<name>.files]]: name (ASCII file name under raw/), url, bytes (0 = unknown), md5 ("" = none published),
#   required, extract (zip/tar is unpacked to extracted/<stem>/), part (group label), song/title (Cambridge-MT).
# [[<name>.folders]] (access = "gdrive_folder"): name, folder_id, required, expected_files.
#
# Checked 2026-09-30: Zenodo sizes/md5/licences via https://zenodo.org/api/records/<id>; the EGDB Drive
# folder via drive.google.com/embeddedfolderview (plain HTML listing, no login); Cambridge-MT: the web site
# (www.cambridge-mt.com, multitracks.cambridge-mt.com) answers every script with a Cloudflare challenge
# (HTTP 403, cf-mitigated: challenge) -> never worked around; but the MTK archive host
# mtkdata.cambridgemusictechnology.co.uk serves plain HTTP 200 for many songs, so those are "direct".

format = "gtab.dataset_registry/1"

