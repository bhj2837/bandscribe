# Downloadable model files (DATA owner, M1_M2_SPEC §9.5 item 7; DESIGN §9.4 `bandscribe models fetch`).
#
# name -> where to get it and where it lives. `bandscribe models fetch <name>` shows URL, size (HTTP HEAD), license and
# destination, asks y/N, downloads through bandscribe.datasets.fetch.download_file and records the file in
# data/models/models.lock.json via bandscribe.models.record. If `sha256` is set the download must match it; if it is
# empty the first download pins it (trust on first use) and `bandscribe models verify` checks against that pin.
# Never called by `bandscribe run` or a worker: a missing model fails at plan time with a Korean message instead.
# Models seeded by P0 (bs_roformer_sw.*, muscriptor-medium) are local-only and have no entry here.

format = "bandscribe.model_sources/1"

["beat_this.final0"]
url = "https://cloud.cp.jku.at/public.php/dav/files/7ik4RrBKTS273gp/final0.ckpt"
dest = "data/models/beat_this/final0.ckpt"
bytes = 81058141
# Pinned 2026-10-03: the local copy's SHA1 equals the server's OC-Checksum (SHA1:e1506282faf66ca10e8ab50ee26bd542b7b9ff0a,
# Last-Modified 2024-07-01, ETag "16b9fd56ab436abbf2779aa85e2b5a87"); its sha256 is the pin from now on.
sha256 = "8c328b45f59d8dd3dff219253ff6a8d6482be57d0133a29140e2febbf8eb8331"
# checked 2026-09-30: github.com/CPJKU/beat_this README "License": code and published model weights are MIT
# (training data partly copyrighted / limited CC - "up to the user to assess").
license = "MIT (code and published weights, CPJKU/beat_this README, checked 2026-09-30); training data partly copyrighted"
source = "https://github.com/CPJKU/beat_this"
notes = "Beat This! final0 (ISMIR 2024): trained on all data except GTZAN, PyTorch Lightning checkpoint without optimizer state. The JKU Nextcloud server announces a SHA1 (OC-Checksum), which the download verifies; no sha256 is published."

